spring:
  application:
    name: ms-cadastro
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/cadastro?connectTimeout=3&socketTimeout=10}
    username: ${DATABASE_USERNAME:insurance}
    password: ${DATABASE_PASSWORD:insurance}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
      initialization-fail-timeout: -1
  task:
    scheduling:
      pool:
        size: 2
  threads:
    virtual:
      enabled: false
  kafka:
    template:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: insurance-cadastro-v1
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 10
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.key.delegate.class]": org.apache.kafka.common.serialization.StringDeserializer
        "[spring.deserializer.value.delegate.class]": io.confluent.kafka.serializers.KafkaAvroDeserializer
        "[specific.avro.reader]": true
        "[schema.registry.url]": ${SCHEMA_REGISTRY_URL:http://localhost:8087}
        "[http.connect.timeout.ms]": 1000
        "[http.read.timeout.ms]": 1000
        "[max.retries]": 0
    listener:
      observation-enabled: true
      ack-mode: manual_immediate
      concurrency: 1
      missing-topics-fatal: true

insurance:
  persistence:
    initialize: ${PERSISTENCE_INITIALIZE:true}
  kafka:
    proposals-topic: insurance.proposals.events.v1

server:
  port: 8082

management:
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
        "[insurance.proposal.register]": true
        "[insurance.outbox.publish]": true
        "[insurance.proposal.consume]": true
        "[insurance.proposal.delivery.latency]": true
    tags:
      service: ${DD_SERVICE:${spring.application.name}}
      env: ${DD_ENV:local}
      version: ${DD_VERSION:0.0.1-SNAPSHOT}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      consume: w3c
      produce: w3c
  opentelemetry:
    resource-attributes:
      "[service.name]": ${DD_SERVICE:${spring.application.name}}
      "[service.version]": ${DD_VERSION:0.0.1-SNAPSHOT}
      "[deployment.environment.name]": ${DD_ENV:local}
      "[deployment.environment]": ${DD_ENV:local}
    tracing:
      export:
        schedule-delay: 1s
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces}
          connect-timeout: 1s
          timeout: 2s
  otlp:
    logging:
      export:
        enabled: false
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:true}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics}
        step: ${OTLP_METRICS_STEP:10s}
        aggregation-temporality: delta
        connect-timeout: 1s
        read-timeout: 2s
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        traceId: trace_id
        spanId: span_id
      add:
        service: ${DD_SERVICE:${spring.application.name}}
        env: ${DD_ENV:local}
        version: ${DD_VERSION:0.0.1-SNAPSHOT}
