name: insurance-quality
services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonarqube-local}
    volumes:
      - sonar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonarqube -d sonarqube"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m
    networks: [quality]
  sonarqube:
    image: sonarqube:26.10.0.133078-community
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonarqube-local}
    ports:
      - "127.0.0.1:${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9000/api/system/status | grep -q '\\\"status\\\":\\\"UP\\\"'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    restart: unless-stopped
    mem_limit: 3g
    stop_grace_period: 60s
    networks: [quality]
networks:
  quality:
    driver: bridge
volumes:
  sonar_postgres:
  sonar_data:
  sonar_extensions:
  sonar_logs:
